<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Material Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gradient-to-br from-indigo-50 to-purple-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="text-center mb-12 animate__animated animate__fadeIn">
            <h1 class="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 mb-4">
                Study Material Analyzer
            </h1>
            <p class="text-gray-600 text-lg">Transform your study materials into learning resources</p>
        </div>
        
        <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl p-8 mb-12 transform transition-all duration-300 hover:scale-[1.02] animate__animated animate__fadeInUp">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-semibold text-gray-800 mb-2">Upload Your Study Material</h2>
                <p class="text-gray-600">Supported formats: PDF, Images (for OCR), and Text files</p>
            </div>
            
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center transition-all duration-300 hover:border-indigo-500 hover:bg-indigo-50">
                <form id="uploadForm" class="space-y-6">
                    <input type="file" id="fileInput" class="hidden" accept=".pdf,.jpg,.jpeg,.png,.txt">
                    <label for="fileInput" class="cursor-pointer">
                        <div class="flex flex-col items-center">
                            <div class="w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center mb-4">
                                <svg class="w-10 h-10 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                                </svg>
                            </div>
                            <span class="text-gray-600 text-lg">Click to upload or drag and drop</span>
                        </div>
                    </label>
                    <div id="fileInfo" class="hidden mt-4 p-4 bg-indigo-50 rounded-lg">
                        <p class="text-indigo-700 font-medium">Selected file: <span id="fileName" class="text-indigo-900"></span></p>
                    </div>
                    <button type="submit" class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-8 py-3 rounded-lg hover:from-indigo-700 hover:to-purple-700 transition-all duration-300 transform hover:scale-105 shadow-lg">
                        <span class="flex items-center justify-center">
                            <span id="buttonText">Analyze Material</span>
                            <span id="loadingSpinner" class="hidden ml-2">
                                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                            </span>
                        </span>
                    </button>
                </form>
            </div>
        </div>

        <div id="statusMessage" class="hidden max-w-2xl mx-auto mb-8 p-4 rounded-lg text-center"></div>

        <div id="results" class="hidden animate__animated animate__fadeIn">
            <div class="max-w-4xl mx-auto">
                <div class="bg-white rounded-2xl shadow-xl p-8 mb-8">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-4">Extracted Keywords</h2>
                    <div id="keywords" class="flex flex-wrap gap-3"></div>
                </div>

                <div class="bg-white rounded-2xl shadow-xl p-8">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-4">Recommended Videos</h2>
                    <div id="videos" class="space-y-6"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // File input handling
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const statusMessage = document.getElementById('statusMessage');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                fileName.textContent = file.name;
                fileInfo.classList.remove('hidden');
            } else {
                fileInfo.classList.add('hidden');
            }
        });

        // Drag and drop handling
        const dropZone = document.querySelector('.border-dashed');
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('border-indigo-500', 'bg-indigo-50');
        }

        function unhighlight(e) {
            dropZone.classList.remove('border-indigo-500', 'bg-indigo-50');
        }

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const file = dt.files[0];
            if (file) {
                fileInput.files = dt.files;
                fileName.textContent = file.name;
                fileInfo.classList.remove('hidden');
            }
        }

        // Form submission handling
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = fileInput.files[0];
            const buttonText = document.getElementById('buttonText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            
            if (!file) {
                showStatus('Please select a file first', 'error');
                return;
            }

            // Show loading state
            buttonText.textContent = 'Analyzing...';
            loadingSpinner.classList.remove('hidden');
            showStatus('Processing your file...', 'info');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (data.status === 'error') {
                    throw new Error(data.message);
                }
                
                // Show success message
                showStatus(`Successfully processed ${data.filename}`, 'success');
                
                // Display keywords with animation
                const keywordsContainer = document.getElementById('keywords');
                keywordsContainer.innerHTML = data.keywords.map((keyword, index) => 
                    `<span class="bg-gradient-to-r from-indigo-100 to-purple-100 text-indigo-800 px-4 py-2 rounded-full transform transition-all duration-300 hover:scale-110 animate__animated animate__fadeInUp" style="animation-delay: ${index * 100}ms">${keyword}</span>`
                ).join('');

                // Display videos with animation
                const videosContainer = document.getElementById('videos');
                videosContainer.innerHTML = data.videos.map((video, index) => `
                    <div class="bg-white rounded-xl shadow-lg p-6 transform transition-all duration-300 hover:scale-[1.02] animate__animated animate__fadeInUp" style="animation-delay: ${index * 100}ms">
                        <div class="flex gap-6">
                            <img src="${video.thumbnail}" alt="${video.title}" class="w-48 h-36 object-cover rounded-lg shadow-md">
                            <div class="flex-1">
                                <h3 class="text-xl font-semibold mb-2 text-gray-800">${video.title}</h3>
                                <p class="text-gray-600 mb-4 line-clamp-2">${video.description}</p>
                                <a href="https://www.youtube.com/watch?v=${video.videoId}" 
                                   target="_blank" 
                                   class="inline-flex items-center px-4 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-lg hover:from-indigo-700 hover:to-purple-700 transition-all duration-300 transform hover:scale-105">
                                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/>
                                    </svg>
                                    Watch on YouTube
                                </a>
                            </div>
                        </div>
                    </div>
                `).join('');

                document.getElementById('results').classList.remove('hidden');
            } catch (error) {
                console.error('Error:', error);
                showStatus(error.message || 'An error occurred while processing your file', 'error');
            } finally {
                // Reset button state
                buttonText.textContent = 'Analyze Material';
                loadingSpinner.classList.add('hidden');
            }
        });

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `max-w-2xl mx-auto mb-8 p-4 rounded-lg text-center animate__animated animate__fadeIn`;
            
            switch(type) {
                case 'error':
                    statusMessage.classList.add('bg-red-100', 'text-red-700');
                    break;
                case 'success':
                    statusMessage.classList.add('bg-green-100', 'text-green-700');
                    break;
                case 'info':
                    statusMessage.classList.add('bg-blue-100', 'text-blue-700');
                    break;
            }
            
            statusMessage.classList.remove('hidden');
        }
    </script>
</body>
</html>
